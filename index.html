<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Actividades - 4to Año</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Control de Actividades y Asistencia</h1>
      <p class="subtitulo">Sistemas de Información · 4to Año</p>
      <div id="bom-info" class="bom-bar"></div>
    </header>

    <section class="panel">
      <form id="registro-form" class="form-grid">
        <input
          type="text"
          id="alumno-input"
          placeholder="Nombre y apellido"
          required
        />
        <input
          type="text"
          id="tema-input"
          placeholder="Actividad o tema"
          required
        />
        <select id="estado-select">
          <option value="Pendiente">Pendiente</option>
          <option value="Entregado">Entregado</option>
        </select>
        <button type="submit" class="btn-primario">Agregar registro</button>
      </form>
    </section>

    <section class="panel">
      <div class="toolbar">
        <span id="contador" class="contador">0 registros</span>
        <div class="acciones-toolbar">
          <select id="filtro-estado">
            <option value="Todos">Todos</option>
            <option value="Pendiente">Pendientes</option>
            <option value="Entregado">Entregados</option>
          </select>
          <button type="button" id="btn-limpiar" class="btn-peligro">
            Vaciar todo
          </button>
        </div>
      </div>

      <ul id="lista-registros" class="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
